<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Premium Furniture Assembly</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        .hover-underline:hover {
            text-decoration: underline !important;
        }
        .password-toggle {
            cursor: pointer;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }
        .social-btn {
            border-color: var(--border);
            color: var(--dark);
        }
        .social-btn:hover {
            background-color: var(--primary) !important;
            color: white !important;
            border-color: var(--primary) !important;
        }
        .theme-rtl-wrapper {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 10;
        }
        html[dir="rtl"] .theme-rtl-wrapper {
            right: auto;
            left: 0;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <!-- Top Right Icons -->
    <div class="theme-rtl-wrapper p-3 p-md-4 d-flex gap-3">
        <button id="theme-toggle" class="btn btn-link p-0 text-decoration-none" aria-label="Toggle dark mode">
            <i class="ri-moon-line fs-4 theme-rtl-icon" style="color: var(--dark);"></i>
        </button>
        <button id="rtl-toggle" class="btn btn-link p-0 text-decoration-none" aria-label="Toggle RTL">
            <i class="ri-arrow-left-right-line fs-4 theme-rtl-icon" style="color: var(--dark);"></i>
        </button>
    </div>

    <!-- Form Container -->
    <div class="container py-5 mt-5 mt-md-0">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card border-0 shadow p-4 p-md-5" style="background-color: var(--card-bg); border-radius: 12px;">
                    
                    <div class="text-center mb-4">
                        <a href="index.html" class="text-decoration-none serif d-inline-flex align-items-center justify-content-center mb-4" style="font-size: 24px; font-weight: 500; color: var(--primary);">
                            <img src="assets/images/favicon.svg" width="32" height="32" alt="Logo" class="me-2">The Assemblers.
                        </a>
                        <h1 class="serif h3 mb-2" style="color: var(--dark);">Log In</h1>
                        <p class="text-muted small">Enter your email and password to access your dashboard.</p>
                    </div>
                    
                    <form action="dashboard.html" method="GET">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label small fw-bold" style="color: var(--dark);">Email Address</label>
                                <input type="email" class="form-control px-3 py-2" placeholder="john@example.com" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold mb-0" style="color: var(--dark);">Password</label>
                                <div class="position-relative mt-2">
                                    <input type="password" id="password-field" class="form-control px-3 py-2 pe-5" placeholder="••••••••" required>
                                    <i class="ri-eye-line password-toggle" id="toggle-password"></i>
                                </div>
                            </div>
                            <div class="col-12 mt-3 d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2">
                                <div class="form-check mb-0">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label small text-muted" for="remember">
                                        Remember me
                                    </label>
                                </div>
                                <a href="#" class="small text-primary text-decoration-none hover-underline">Forgot Password?</a>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Log In</button>
                            </div>
                        </div>
                    </form>
                    
                    <div class="mt-4">
                        <div class="position-relative text-center mb-4">
                            <hr class="text-muted">
                            <span class="position-absolute top-50 start-50 translate-middle px-3 small text-muted" style="background-color: var(--card-bg);">or continue with</span>
                        </div>
                        <div class="d-flex flex-column gap-2">
                            <a href="#" class="btn btn-outline-dark w-100 py-2 d-flex align-items-center justify-content-center gap-2 social-btn">
                                <i class="ri-google-fill fs-5"></i> Google
                            </a>
                            <a href="#" class="btn btn-outline-dark w-100 py-2 d-flex align-items-center justify-content-center gap-2 social-btn">
                                <i class="ri-facebook-fill fs-5"></i> Facebook
                            </a>
                        </div>
                    </div>

                    <div class="text-center mt-4 pt-2">
                        <p class="text-muted small mb-0">Don't have an account? <a href="signup.html" class="text-primary fw-bold text-decoration-none hover-underline">Sign up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // Password Toggle
        const togglePassword = document.getElementById('toggle-password');
        const passwordField = document.getElementById('password-field');
        if(togglePassword && passwordField) {
            togglePassword.addEventListener('click', function () {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                this.classList.toggle('ri-eye-line');
                this.classList.toggle('ri-eye-off-line');
            });
        }
    </script>
</body>
</html>
